<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf2ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vocab Chat" />
    <title>Vocab Chat</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <a class="back-link" href="../" aria-label="Back to Playground Apps" title="Back to apps">←</a>
        <img class="app-icon" src="./icon.svg" alt="" />
        <div>
          <h1>Vocab Chat</h1>
          <p id="topicCount">64 topics</p>
        </div>
      </header>

      <section class="controls" aria-label="Chat settings">
        <label>
          <span>Topic</span>
          <select id="topicSelect"></select>
        </label>
        <label>
          <span>Mood</span>
          <select id="moodSelect">
            <option value="small-talk">small talk</option>
            <option value="bestie">bestie</option>
            <option value="casual">casual</option>
            <option value="gossip">gossip</option>
            <option value="flirty">light crush talk</option>
            <option value="study">study buddy</option>
          </select>
        </label>
        <button id="dailyBtn" class="utility-btn" type="button">Today</button>
        <button id="randomBtn" class="utility-btn" type="button">Random</button>
      </section>

      <section class="topic-summary" aria-live="polite">
        <div>
          <p class="topic-kicker">Today's topic</p>
          <h2 id="topicTitle"></h2>
          <p id="topicVibe"></p>
        </div>
        <span id="wordCount" class="word-count"></span>
      </section>

      <nav class="tabs" aria-label="Vocab Chat views">
        <button id="chatTab" class="tab-btn active" type="button">Chat</button>
        <button id="wordsTab" class="tab-btn" type="button">Words</button>
      </nav>

      <section id="chatView" class="view active" aria-label="Chat with Mia">
        <header class="chat-header">
          <span class="friend-avatar" aria-hidden="true">M</span>
          <div>
            <strong>Mia</strong>
            <span id="chatMoodLabel"></span>
          </div>
        </header>
        <div id="chatLog" class="chat-log" aria-live="polite"></div>
        <form id="composer" class="composer">
          <textarea id="messageInput" rows="1" placeholder="Message Mia..." aria-label="Message Mia"></textarea>
          <button id="sendBtn" class="send-btn" type="submit">Send</button>
        </form>
      </section>

      <section id="wordsView" class="view" aria-label="Vocabulary list">
        <div id="wordList" class="word-list"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
