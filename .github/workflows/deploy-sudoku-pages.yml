name: Deploy Playground Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sudoku-app/**'
      - 'vocab-chat-app/**'
      - 'playground-apps/**'
      - 'course-deadline-tracker/**'
      - '.github/workflows/deploy-sudoku-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -R sudoku-app _site/sudoku-app
          cp -R vocab-chat-app _site/vocab-chat-app
          cp -R course-deadline-tracker _site/deadline-tracker
          cp playground-apps/index.html _site/index.html
          cp playground-apps/styles.css _site/styles.css
          cp playground-apps/manifest.webmanifest _site/manifest.webmanifest
          cp playground-apps/icon.svg _site/icon.svg
          cp playground-apps/sw.js _site/sw.js
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="theme-color" content="#eef4f0">
              <meta name="apple-mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-title" content="Playground Apps">
              <title>Playground Apps</title>
              <link rel="manifest" href="./manifest.webmanifest">
              <link rel="apple-touch-icon" href="./icon.svg">
              <style>
                body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; background: #eef4f0; color: #111c17; }
                main { max-width: 760px; margin: 0 auto; padding: 76px 28px; display: grid; gap: 18px; }
                h1 { margin: 0 0 34px; font-size: clamp(46px, 11vw, 68px); line-height: .98; }
                a { display: block; padding: 22px; border-radius: 20px; background: white; color: #145c52; font-size: 26px; font-weight: 850; text-decoration: none; box-shadow: 0 16px 34px rgba(17, 28, 23, .09); }
                small { display: block; margin-top: 8px; color: #617067; font-size: 14px; font-weight: 750; }
              </style>
            </head>
            <body>
              <main>
                <h1>Playground Apps</h1>
                <a href="./vocab-chat-app/">Vocab Chat<small>daily vocabulary and friend-style practice</small></a>
                <a href="./sudoku-app/">Sudoku<small>soft mobile puzzle app</small></a>
              </main>
            </body>
          </html>
          HTML
          cat > _site/deadline-tracker/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="theme-color" content="#eef4f0">
              <meta name="apple-mobile-web-app-capable" content="yes">
              <meta name="apple-mobile-web-app-title" content="Playground Apps">
              <title>Playground Apps</title>
              <link rel="manifest" href="./manifest.webmanifest">
              <link rel="apple-touch-icon" href="./icon.svg">
              <style>
                body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; background: #eef4f0; color: #111c17; }
                main { max-width: 760px; margin: 0 auto; padding: 76px 28px; display: grid; gap: 18px; }
                h1 { margin: 0 0 34px; font-size: clamp(46px, 11vw, 68px); line-height: .98; }
                a { display: block; padding: 22px; border-radius: 20px; background: white; color: #145c52; font-size: 26px; font-weight: 850; text-decoration: none; box-shadow: 0 16px 34px rgba(17, 28, 23, .09); }
                small { display: block; margin-top: 8px; color: #617067; font-size: 14px; font-weight: 750; }
              </style>
            </head>
            <body>
              <main>
                <h1>Playground Apps</h1>
                <a href="../vocab-chat-app/">Vocab Chat<small>daily vocabulary and friend-style practice</small></a>
                <a href="../sudoku-app/">Sudoku<small>soft mobile puzzle app</small></a>
              </main>
            </body>
          </html>
          HTML

      - name: Upload apps
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
