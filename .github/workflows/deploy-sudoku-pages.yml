name: Deploy Playground Apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'sudoku-app/**'
      - 'vocab-chat-app/**'
      - 'playground-apps/**'
      - 'course-deadline-tracker/**'
      - '.github/workflows/deploy-sudoku-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        run: |
          mkdir -p _site
          cp -R sudoku-app _site/sudoku-app
          cp -R vocab-chat-app _site/vocab-chat-app
          cp -R course-deadline-tracker _site/deadline-tracker
          cp playground-apps/index.html _site/index.html
          cp playground-apps/styles.css _site/styles.css
          cp playground-apps/manifest.webmanifest _site/manifest.webmanifest
          cp playground-apps/icon.svg _site/icon.svg
          cp playground-apps/sw.js _site/sw.js

      - name: Upload apps
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
